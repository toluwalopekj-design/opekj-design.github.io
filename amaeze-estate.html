<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMAEZE ESTATE | Applause Property</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background: #0a1f0a; color: #fff; line-height: 1.6; }
        
        /* Navigation */
        .navbar { position: fixed; top: 0; left: 0; right: 0; padding: 0.8rem 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(10,31,10,0.95); backdrop-filter: blur(10px); z-index: 1000; }
        .logo { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; }
        .logo img { height: 42px; width: auto; display: block; }
        .nav-links { display: flex; gap: 1.5rem; list-style: none; }
        .nav-links a { color: #a3c9a3; text-decoration: none; font-size: 0.85rem; font-weight: 500; text-transform: uppercase; }
        .nav-links a:hover { color: #fff; }
        .mobile-menu-btn { display: none; background: none; border: none; color: #c8f542; font-size: 1.8rem; cursor: pointer; }

        /* Video Styling */
        .video-container { margin-top: 1.5rem; width: 100%; border-radius: 12px; overflow: hidden; }
        .video-container iframe { width: 100%; aspect-ratio: 16/9; border: none; }

        /* Existing Styles maintained */
        .estate-detail { min-height: 100vh; padding: 6rem 5% 3rem; background: #0a1f0a; }
        .estate-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; max-width: 1100px; margin: 0 auto; }
        .estate-images { display: grid; grid-template-columns: 1fr; gap: 1rem; }
        .flyer-img { width: 100%; border-radius: 12px; }
        .estate-info-panel { background: #143214; border: 1px solid #1a3d1a; border-radius: 16px; padding: 2rem; }
        .estate-price-box { background: #0d260d; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; text-align: center; border: 1px solid #1a3d1a; }
        .promo { font-size: 2rem; font-weight: 700; color: #c8f542; }
        .btn { padding: 0.9rem 2rem; border-radius: 10px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; text-transform: uppercase; text-align: center; }
        .btn-primary { background: #c8f542; color: #0a1f0a; width: 100%; margin-bottom: 1rem; }
        .btn-outline { background: transparent; color: #c8f542; border: 2px solid #c8f542; width: 100%; }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .mobile-menu-btn { display: block; }
            .estate-detail-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">
            <!-- Ensure logo.png is in assets/images/ -->
            <img src="assets/images/logo.png" alt="Applause Property Logo">
        </a>
        <ul class="nav-links">
            <li><a href="index.html">HOME</a></li>
            <li><a href="index.html#process">PROCESS</a></li>
            <li><a href="index.html#properties">PROPERTIES</a></li>
            <li><a href="index.html#about">ABOUT</a></li>
            <li><a href="index.html#faq">FAQ</a></li>
            <li><a href="index.html#contact">CONTACT</a></li>
        </ul>
        <button class="mobile-menu-btn">☰</button>
    </nav>

    <section class="estate-detail">
        <div class="estate-detail-grid">
            <div class="estate-images">
                <img src="assets/images/amaeze-flyer.jpg" class="flyer-img" alt="Amaeze Estate Flyer">
                
                <!-- YouTube Video Section -->
                <div class="video-container">
                    <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID" allowfullscreen></iframe>
                </div>
            </div>
            
            <div class="estate-info-panel">
                <div class="estate-price-box">
                    <div class="promo">N18.5M</div>
                    <div class="instant">Instant Allocation</div>
                </div>
                
                <div class="estate-landmarks">
                    <h3>Landmarks</h3>
                    <ul>
                        <li>5 minutes from Okpanam City Gate</li>
                        <li>5 minutes from Admiralty University</li>
                    </ul>
                </div>

                <div class="estate-cta">
                    <a href="https://wa.me/2349164961193" class="btn btn-primary">Book Inspection</a>
                    <a href="index.html#contact" class="btn btn-outline">Contact Us</a>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <a href="index.html" class="logo">
             <img src="assets/images/logo.png" alt="Applause Property Logo">
        </a>
        <p>© 2026 APPLAUSE PROPERTY. ALL RIGHTS RESERVED.</p>
    </footer>

</body>
</html>
