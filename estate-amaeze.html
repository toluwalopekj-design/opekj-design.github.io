<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMAEZE ESTATE | Applause Property</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a1f0a; color: #fff; line-height: 1.6; }
        
        /* Nav */
        .navbar { position: sticky; top: 0; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(10,31,10,0.95); z-index: 1000; }
        .logo img { height: 40px; }
        .nav-links { display: flex; gap: 20px; list-style: none; }
        .nav-links a { color: #a3c9a3; text-decoration: none; font-size: 0.8rem; text-transform: uppercase; }

        /* Grid */
        .estate-detail { padding: 2rem 5%; }
        .estate-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; max-width: 1100px; margin: 0 auto; }
        .estate-info-panel { background: #143214; padding: 2rem; border-radius: 12px; }
        
        /* Video */
        .video-container { margin-bottom: 2rem; }
        .video-container iframe { width: 100%; aspect-ratio: 16/9; border-radius: 12px; }
        
        .flyer-img { width: 100%; border-radius: 12px; margin-bottom: 1rem; }
        .btn { padding: 10px 20px; border-radius: 8px; text-decoration: none; display: block; text-align: center; margin-bottom: 10px; text-transform: uppercase; font-weight: bold; }
        .btn-primary { background: #c8f542; color: #0a1f0a; }
        .btn-outline { border: 1px solid #c8f542; color: #c8f542; }

        @media (max-width: 768px) { .estate-detail-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">
            <img src="assets/images/logo.png" alt="Logo">
        </a>
        <ul class="nav-links">
            <li><a href="index.html">HOME</a></li>
            <li><a href="#process">PROCESS</a></li>
            <li><a href="#properties">PROPERTIES</a></li>
        </ul>
    </nav>

    <section class="estate-detail">
        <div class="estate-detail-grid">
            <div class="left-col">
                <img src="assets/images/amaeze-flyer.jpg" class="flyer-img" alt="Flyer">
                <div class="video-container">
                    <!-- Replace YOUR_VIDEO_ID below -->
                    <iframe src="https://youtu.be/iOofXnKtJf8?si=k-OmSCCxEorecfgZ" allowfullscreen></iframe>
                </div>
            </div>
            
            <div class="estate-info-panel">
                <h1>AMAEZE ESTATE</h1>
                <div class="estate-price-box">
                    <p>N18.5M</p>
                </div>
                <div class="estate-features">
                    <h3>Features</h3>
                    <ul>
                        <li>CCTV</li>
                        <li>Security</li>
                        <li>Good Road</li>
                    </ul>
                </div>
                <div class="estate-cta">
                    <a href="https://wa.me/2349164961193" class="btn btn-primary">Book Inspection</a>
                    <a href="index.html#contact" class="btn btn-outline">Contact Us</a>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
